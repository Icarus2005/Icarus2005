[build]
  # migrate deploy only applies pending migrations (never destructive/reset);
  # requires DATABASE_URL and DIRECT_URL set as site environment variables.
  command = "prisma migrate deploy && prisma generate && next build"

[build.environment]
  # Prisma's generated client is used at request time by serverless
  # functions; the Next.js runtime plugin below handles the rest.
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
